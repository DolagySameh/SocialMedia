<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow">
  <h1 class="text-2xl font-bold mb-4">Sign up</h1>
  @if (error()) {
    <div class="mb-3 text-red-600 text-sm">{{ error() }}</div>
  }
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm mb-1">Name</label>
      <input formControlName="name" class="w-full border rounded-md px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Email</label>
      <input formControlName="email" type="email" class="w-full border rounded-md px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Password</label>
      <input formControlName="password" type="password" class="w-full border rounded-md px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Confirm password</label>
      <input formControlName="rePassword" type="password" class="w-full border rounded-md px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Date of birth</label>
      <input formControlName="dateOfBirth" type="date" class="w-full border rounded-md px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Gender</label>
      <select formControlName="gender" class="w-full border rounded-md px-3 py-2">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <button type="submit" [disabled]="loading()" class="w-full bg-indigo-600 text-white py-2 rounded-md disabled:opacity-50">
      {{ loading() ? 'Loading...' : 'Create account' }}
    </button>
  </form>
  <p class="mt-4 text-sm">Already have account? <a routerLink="/login" class="text-indigo-600">Login</a></p>
</div>
