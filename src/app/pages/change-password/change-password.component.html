<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow">
  <h1 class="text-2xl font-bold mb-4">Change password</h1>
  @if (error()) { <div class="mb-3 text-red-600 text-sm">{{ error() }}</div> }
  @if (success()) { <div class="mb-3 text-green-600 text-sm">{{ success() }}</div> }
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm mb-1">Current password</label>
      <input formControlName="password" type="password" class="w-full border rounded-md px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">New password</label>
      <input formControlName="newPassword" type="password" class="w-full border rounded-md px-3 py-2" />
    </div>
    <button type="submit" [disabled]="loading()" class="w-full bg-indigo-600 text-white py-2 rounded-md disabled:opacity-50">
      {{ loading() ? 'Loading...' : 'Change password' }}
    </button>
  </form>
</div>
